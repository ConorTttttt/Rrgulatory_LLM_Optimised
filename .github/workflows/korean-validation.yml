name: Korean SDS Knowledge QA
on:
  push:
    paths:
      - "korean/**"
      - ".agents/skills/korean-sds-compliance/**"
      - ".github/workflows/korean-validation.yml"
  pull_request:
    paths:
      - "korean/**"
      - ".agents/skills/korean-sds-compliance/**"
      - ".github/workflows/korean-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  korean-structural-and-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate main-body knowledge base
        run: python korean/build.py --validate
      - name: Validate all seven annex-derived datasets
        run: python korean/annexes/validate_annexes.py
      - name: Run conservative preflight regression tests
        run: python -m unittest discover -s korean/tests -p "test_*.py" -v
      - name: Test Korean law-first Gemini SDS skill
        run: python -m unittest discover -s .agents/skills/korean-sds-compliance/tests -p "test_*.py" -v
      - name: Parse every JSON and JSONL reference
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path("korean")
          json_count = 0
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              json_count += 1
          for path in root.rglob("*.jsonl"):
              for n, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.strip():
                      try:
                          json.loads(line)
                      except ValueError as err:
                          raise ValueError(f"{path}:{n}: {err}") from err
              json_count += 1
          print(f"PASS: {json_count} structured data files parsed")
          PY
